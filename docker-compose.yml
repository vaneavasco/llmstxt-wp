version: '3.8'

services:
  # Fast unit tests (no WordPress needed)
  # Usage: docker-compose run test
  test:
    build: .
    volumes:
      - .:/app
      - /app/vendor  # Preserve vendor from image
    command: composer test:unit

  # Run all tests with coverage
  # Usage: docker-compose run test-coverage
  test-coverage:
    build: .
    volumes:
      - .:/app
      - /app/vendor
    command: composer test:coverage

  # Integration tests with real WordPress
  wordpress:
    image: wordpress:6.4-php8.1
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress_test
    volumes:
      - wordpress_data:/var/www/html
      - .:/var/www/html/wp-content/plugins/llmstxt-wp
    ports:
      - "8080:80"

  # MySQL database for integration tests
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: wordpress_test
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    tmpfs:
      - /var/lib/mysql  # RAM disk for speed
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Run integration tests
  # Usage: docker-compose run test-integration
  test-integration:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      WP_TESTS_DB_HOST: db
      WP_TESTS_DB_NAME: wordpress_test
      WP_TESTS_DB_USER: wordpress
      WP_TESTS_DB_PASS: wordpress
    volumes:
      - .:/app
      - /app/vendor
    command: composer test:integration

  # Linting
  # Usage: docker-compose run lint
  lint:
    build: .
    volumes:
      - .:/app
      - /app/vendor
    command: composer lint

volumes:
  wordpress_data:
